model:
  base_learning_rate: 1.0e-06
  target: ldm.models.ControlNet.cldm.ControlLDMInPaintConcat
  params:
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: masked_image
    control_key: masked_image
    image_size: 128
    channels: 3
    cond_stage_trainable: false
    conditioning_key: concat # concat/crossattn/hybrid
    monitor: val/loss
    ckpt_path: "models/ldm/inpainting_big/model_compvis.ckpt"
    # ckpt_path: "models/ldm/ControlNet/v15-control.ckpt"
    scale_factor: 0.18215
    use_ema: False
    only_mid_control: False
    sd_locked: True

    control_stage_config:
      target: ldm.models.ControlNet.cldm.ControlNet
      params:
        image_size: 32 # unused
        in_channels: 7
        hint_channels: 4
        model_channels: 256
        attention_resolutions: [ 8, 4, 2 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 3, 4 ]
        num_heads: 8
        use_spatial_transformer: False
        transformer_depth: 1
        context_dim: #768
        use_checkpoint: True
        legacy: False
        

    unet_config:
      target: ldm.models.ControlNet.cldm.ControlledUnetModel
      params:
        image_size: 32 # unused
        in_channels: 7
        out_channels: 3
        model_channels: 256
        attention_resolutions: [ 8, 4, 2 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 3, 4 ]
        num_heads: 8
        use_spatial_transformer: False #True
        transformer_depth: 1
        context_dim: # 768
        use_checkpoint: True
        legacy: False
        resblock_updown: true

    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        embed_dim: 3
        n_embed: 8192
        monitor: val/rec_loss
        ddconfig:
          attn_type: none # concat mode
          double_z: false
          z_channels: 3
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity # NO TRAIN FOR AUTOENCODER
    cond_stage_config: __is_first_stage__
      # target: ldm.modules.encoders.modules.FrozenCLIPImageEmbedder

data:
  target: main_inpainting.DataModuleFromConfig
  params:
    batch_size: 6
    num_workers: 2
    wrap: false
    train:
      target: ldm.data.inpainting_dataset.InpaintingTrain
      params:
        csv_file: ./data/dataset_0428-single/train.csv
        data_root: ./data/dataset_0428-single/train_data
        size: 512
        inpainted: True
        random_null: True
    validation:
      target: ldm.data.inpainting_dataset.InpaintingValidation
      params:
        csv_file: ./data/dataset_0428-single/train.csv
        data_root: ./data/dataset_0428-single/train_data
        size: 512
        inpainted: True
        random_null: False


lightning:
  find_unused_parameters: False

  callbacks:
    image_logger:
      target: main_inpainting.ImageLogger
      params:
        disabled: True
        batch_frequency: 750
        max_images: 4
        increase_log_steps: True
        log_first_step: False
        log_images_kwargs:
          use_ema_scope: False
          plot_progressive_rows: False # disable this for training
          plot_diffusion_rows: False # disable this for training
          N: 4
          unconditional_guidance_scale: 1.0
          unconditional_guidance_label: [""]
          ddim_steps: 50  # todo check these out for inpainting,
          ddim_eta: 0.0   # todo check these out for inpainting,